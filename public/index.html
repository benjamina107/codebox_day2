<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3c2b1b" />
    <meta
      name="description"
      content="Drop and merge matching poops. Enter your username to save and resume your game."
    />
    <title>A Shitty Game</title>
    <link rel="icon" href="/assets/poop-5.png" />
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/vendor/matter.min.js"></script>
    <script defer src="/config.js"></script>
    <script defer src="/physics.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div class="background-art" aria-hidden="true">
      <div class="doodle doodle-one"></div>
      <div class="doodle doodle-two"></div>
      <div class="doodle doodle-three"></div>
      <div class="doodle doodle-four"></div>
    </div>
    <header class="site-header">
      <a class="home-link" href="/">Home</a>
      <div class="header-actions">
        <button id="player-button" class="text-button" hidden>
          <span id="player-name"></span> ⌄
        </button>
      </div>
    </header>
    <main>
      <section id="home" class="home">
        <h1 class="hero-logo" aria-label="A Shitty Game">
          <span class="hero-a">A</span><span class="hero-shitty">SHiTTY</span
          ><span class="hero-game">Game</span>
        </h1>
        <form id="enter-form" class="enter-form">
          <label class="sr-only" for="username">Username</label>
          <input
            id="username"
            name="username"
            placeholder="Username"
            minlength="3"
            maxlength="20"
            pattern="[A-Za-z0-9_]{3,20}"
            autocomplete="username"
            required
          />
          <p id="enter-error" class="form-error" role="alert"></p>
          <button
            id="enter-button"
            class="play-button"
            type="submit"
            aria-label="Play"
          >
            <span class="play-icon" aria-hidden="true"></span>
          </button>
        </form>
        <div id="welcome" class="welcome" hidden>
          <div id="welcome-text" class="username-display"></div>
          <button
            id="resume-button"
            class="play-button"
            aria-label="Resume game"
          >
            <span class="play-icon" aria-hidden="true"></span>
          </button>
          <button id="home-piles" class="text-button">Saved games</button>
        </div>
      </section>
      <section id="play" class="play" hidden>
        <div class="board-column">
          <div class="game-hud">
            <div class="score-group">
              <span>Score <strong id="score">0</strong></span
              ><span>Best <strong id="best-score">0</strong></span>
            </div>
            <div class="next-preview">
              <span>Next</span
              ><img id="next-image" src="/assets/poop-1.png" alt="Next poop" />
            </div>
          </div>
          <div class="board-wrap">
            <canvas
              id="board"
              width="400"
              height="570"
              tabindex="0"
              aria-label="Poop drop board. Use left and right arrows to aim, then Space or Enter to drop."
            ></canvas>
            <div id="board-overlay" class="board-overlay" hidden>
              <h2 id="overlay-title">Paused</h2>
              <p id="overlay-copy"></p>
              <button id="overlay-button" class="primary-button">Resume</button>
            </div>
          </div>
          <div class="board-heading">
            <span id="game-name">Game</span
            ><button
              id="rename-button"
              class="text-button"
              aria-label="Rename game"
            >
              ✎</button
            ><span id="save-status" role="status">Saved</span>
          </div>
          <div class="game-actions">
            <button id="pause-button" class="text-button">Pause</button
            ><button id="save-button" class="text-button">Save & exit</button
            ><button id="new-button" class="text-button">New game</button
            ><button id="piles-button" class="text-button">Saved games</button>
          </div>
        </div>
      </section>
    </main>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="piles-dialog">
      <button class="dialog-close" data-close aria-label="Close saved games">
        ×
      </button>
      <h2>Saved games</h2>
      <div id="piles-list" class="piles-list"></div>
      <button id="piles-new-button" class="primary-button">New game</button>
    </dialog>
    <dialog id="name-dialog">
      <button class="dialog-close" data-close aria-label="Close name form">
        ×
      </button>
      <h2 id="name-title">New game</h2>
      <form id="name-form">
        <label for="pile-name">Game name</label
        ><input
          id="pile-name"
          maxlength="40"
          required
          placeholder="Game name"
        />
        <p id="name-error" class="form-error" role="alert"></p>
        <button class="primary-button" type="submit" id="name-submit">
          Play
        </button>
      </form>
    </dialog>
    <dialog id="delete-dialog">
      <button class="dialog-close" data-close aria-label="Cancel deletion">
        ×
      </button>
      <h2>Delete game?</h2>
      <p id="delete-copy"></p>
      <div class="dialog-actions">
        <button id="delete-confirm" class="primary-button">Delete</button
        ><button class="text-button" data-close>Cancel</button>
      </div>
    </dialog>
    <dialog id="account-dialog">
      <button class="dialog-close" data-close aria-label="Close player menu">
        ×
      </button>
      <h2 id="account-title">Username</h2>
      <p>Enter this username to return to your saved games from any browser.</p>
      <button id="logout-button" class="primary-button">Save & sign out</button>
    </dialog>
  </body>
</html>
